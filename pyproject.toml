[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tomus"
version = "1.1.0"
description = "Tomus — Organizador Acadêmico de PDFs baseado na taxonomia CAPES/CNPq"
requires-python = ">=3.11"
authors = [
    { name = "Dario" },
]
dependencies = [
    "pymupdf",
    "docling",
    "rapidocr",
    "onnxruntime",
    "httpx",
    "tenacity",
    "rapidfuzz",
    "python-stdnum",
    "pydantic",
    "pydantic-settings",
    "google-genai",
    "typer",
    "rich",
    "tomli-w",
    "pyside6>=6.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "respx",
    "ruff",
]

[project.scripts]
tomus = "tomus.cli.main:app"

[project.gui-scripts]
tomus-gui = "tomus.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tomus"]

[tool.pytest.ini_options]
markers = [
    "slow: testes lentos sobre o repositorio de referencia",
]
filterwarnings = [
    "ignore::FutureWarning:google.*",
    "ignore::FutureWarning:fitz.*",
    "ignore:.*urllib3 v2 only supports OpenSSL.*",
    "ignore::DeprecationWarning:.*SwigPy.*",
    "ignore::DeprecationWarning:.*swigvarlink.*",
]
