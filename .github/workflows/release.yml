name: Release Tomus macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências do sistema (macOS)
        run: |
          brew install create-dmg || true

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<70"
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Executar testes
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -m "not slow" -q

      - name: Build macOS (DMG + .app)
        run: |
          chmod +x packaging/build_macos.sh
          ./packaging/build_macos.sh

      - name: Listar artifacts gerados
        shell: bash
        run: |
          echo "=== Arquivos em dist/ ==="
          ls -la dist/ 2>/dev/null || echo "dist/ não encontrado"

      - name: Upload artifact (macOS DMG)
        uses: actions/upload-artifact@v4
        with:
          name: tomus-macos-dmg
          path: dist/*.dmg
          retention-days: 30

  release:
    needs: build-macos
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Baixar artifacts (macOS DMG)
        uses: actions/download-artifact@v4
        with:
          name: tomus-macos-dmg
          path: release-assets/macos

      - name: Listar assets disponíveis para release
        run: |
          echo "=== Assets disponíveis ==="
          ls -la release-assets/macos/ 2>/dev/null || true

      - name: Criar ou Atualizar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/macos/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
