name: Release BiblioTEC

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências do sistema (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg || true

      - name: Instalar dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2 wget curl xz-utils libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 xvfb

      - name: Instalar dependências do sistema (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --yes

      - name: Instalar dependências Python
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Executar testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -m "not slow" -q

      - name: Build macOS (DMG + .app)
        if: runner.os == 'macOS'
        run: |
          chmod +x packaging/build_macos.sh
          ./packaging/build_macos.sh

      - name: Build Linux (AppImage)
        if: runner.os == 'Linux'
        run: |
          chmod +x packaging/build_linux_appimage.sh
          ./packaging/build_linux_appimage.sh

      - name: Build Windows (Inno Setup instalador .exe)
        if: runner.os == 'Windows'
        run: |
          echo "📦 Gerando binário com PyInstaller..."
          pyinstaller --clean -y packaging/pyinstaller.spec
          echo "🔧 Gerando instalador Windows com Inno Setup..."
          iscc packaging/windows_installer.iss

      - name: Listar artifacts gerados
        run: |
          echo "=== Arquivos em dist/ ==="
          ls -la dist/ 2>/dev/null || echo "dist/ não encontrado"
          echo "=== Arquivos em build/ ==="
          ls -la build/ 2>/dev/null || echo "build/ não encontrado"

      - name: Upload artifact (macOS DMG)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: bibliotec-macos-dmg
          path: dist/*.dmg
          retention-days: 30

      - name: Upload artifact (Linux AppImage)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: bibliotec-linux-appimage
          path: dist/*.AppImage
          retention-days: 30

      - name: Upload artifact (Windows EXE instalador Inno Setup)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: bibliotec-windows-exe
          path: dist/*Setup*.exe
          retention-days: 30

  release:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Baixar artifacts (macOS DMG)
        uses: actions/download-artifact@v4
        with:
          name: bibliotec-macos-dmg
          path: release-assets/macos

      - name: Baixar artifacts (Linux AppImage)
        uses: actions/download-artifact@v4
        with:
          name: bibliotec-linux-appimage
          path: release-assets/linux

      - name: Baixar artifacts (Windows EXE)
        uses: actions/download-artifact@v4
        with:
          name: bibliotec-windows-exe
          path: release-assets/windows

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/macos/*.dmg
            release-assets/linux/*.AppImage
            release-assets/windows/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
