name: Release Build & Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências e PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Executar Build do macOS
        run: |
          chmod +x packaging/build_macos.sh
          ./packaging/build_macos.sh

      - name: Upload Artefato macOS
        uses: actions/upload-artifact@v4
        with:
          name: BiblioTEC-macOS-DMG
          path: dist/*.dmg

  build-windows:
    name: Build Windows (.exe Installer)
    runs-on: windows-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências e PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Compilar com PyInstaller
        run: |
          pyinstaller --clean -y packaging/pyinstaller.spec

      - name: Compilar Instalador Inno Setup
        uses: JonMar/action-innosetup@v1
        with:
          innoScript: packaging/windows_installer.iss

      - name: Upload Artefato Windows
        uses: actions/upload-artifact@v4
        with:
          name: BiblioTEC-Windows-Setup
          path: dist/*_Setup_*.exe

  build-linux:
    name: Build Linux (.AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libegl1-mesa

      - name: Instalar Dependências Python e PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Gerar AppImage
        run: |
          chmod +x packaging/build_linux_appimage.sh
          ./packaging/build_linux_appimage.sh

      - name: Upload Artefato Linux
        uses: actions/upload-artifact@v4
        with:
          name: BiblioTEC-Linux-AppImage
          path: dist/*.AppImage

  publish-release:
    name: Publicar Release no GitHub
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Todos os Artefatos
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organizar Arquivos para Release
        run: |
          mkdir -p final-assets
          find release-artifacts -type f -exec cp {} final-assets/ \;
          ls -la final-assets/

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-assets/*
          name: BiblioTEC ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
