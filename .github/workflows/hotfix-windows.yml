name: Release BiblioTEC - Windows Hotfix

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão para o instalador Windows (ex: 1.0.1)"
        required: false
        default: ""

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Inno Setup
        run: |
          choco install innosetup --yes

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<70"
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Extrair versão da tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "Versão detectada: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Gerar binário com PyInstaller
        run: |
          pyinstaller --clean -y packaging/pyinstaller.spec

      - name: Gerar instalador Windows com Inno Setup
        run: |
          echo "🔧 Gerando instalador Windows com versão ${{ steps.version.outputs.version }}..."
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} packaging/windows_installer.iss

      - name: Renomear artefato com versão explícita
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # O Inno Setup gera: BiblioTEC_Setup_v{VERSION}_Windows_x64.exe
          # Garantir que o nome final está correto
          ls -la dist/
          if [ -f "dist/BiblioTEC_Setup_v${VERSION}_Windows_x64.exe" ]; then
            echo "✅ Instalador gerado com sucesso: dist/BiblioTEC_Setup_v${VERSION}_Windows_x64.exe"
          else
            echo "⚠️ Procurando instalador gerado..."
            ls -la dist/*Setup*.exe 2>/dev/null || true
          fi

      - name: Upload artifact Windows EXE instalador
        uses: actions/upload-artifact@v4
        with:
          name: bibliotec-windows-exe-hotfix
          path: dist/BiblioTEC_Setup_v${{ steps.version.outputs.version }}_Windows_x64.exe
          retention-days: 30

  release-windows:
    needs: build-windows
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Baixar artifact Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: bibliotec-windows-exe-hotfix
          path: release-assets/windows

      - name: Listar assets
        run: |
          echo "=== Assets Windows ==="
          find release-assets -type f 2>/dev/null || true

      - name: Criar ou Atualizar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/windows/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
